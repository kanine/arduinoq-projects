<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzzer Control</title>
    <link rel="icon" type="image/png" href="./img/favicon.png">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div>
        <div class="header">
            <h1 class="arduino-text">Buzzer Control</h1>
            <img class="arduino-logo" src="./img/RGB-Arduino-Logo_Color Inline Loop.svg" alt="Arduino Logo">
        </div>

        <div class="container">
            <p class="status-text" id="status-text">BUZZER OFF</p>

            <!-- Toggle Switch -->
            <div class="toggle-container">
                <label class="toggle-switch">
                    <input type="checkbox" id="buzzer-toggle">
                    <span class="slider"></span>
                </label>
            </div>

            <p class="instruction-text">Toggle to turn the buzzer on or off 🔔</p>

            <!-- Error message container -->
            <div id="error-container" class="error-message" style="display: none;"></div>
        </div>
    </div>

    <script src="libs/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
